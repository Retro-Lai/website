<div class="wrap">

  <div class="sectitle" style="margin-top:40px"><h2>Contact</h2><span class="line"></span></div>

  <div class="hero" style="padding-top:0;align-items:start">
    <!-- contact form window -->
    <div class="win" style="margin:0">
      <div class="bar"><span class="dots"><span class="y"></span><span class="m"></span><span class="c"></span></span><span class="ttl">new-message.exe</span><span class="ctrls"><span>_</span><span>□</span><span>×</span></span></div>
      <div class="body">
        <!-- Contact form -> Formspree (messages arrive in your Formspree inbox / email) -->
        <form id="contactform" action="https://formspree.io/f/xaeqzade" method="POST">
          <div class="field"><label for="nm">Your Name</label><input id="nm" name="name" type="text" maxlength="100" autocomplete="name" placeholder="type here…"></div>
          <div class="field"><label for="em">Email</label><input id="em" name="email" type="email" required autocomplete="email" placeholder="you@email.com"></div>
          <div class="field"><label for="ms">Message</label><textarea id="ms" name="message" rows="5" maxlength="2000" required placeholder="tell me about your project…"></textarea></div>
          <button type="submit" class="btn magenta">Send Message →</button>
          <p class="formstatus" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>

    <!-- info window -->
    <div>
      <div class="win" style="margin:0 0 24px">
        <div class="bar cyan"><span class="ttl">say-hi.txt</span></div>
        <div class="body">
          <!-- EDIT: your contact details -->
          <p style="margin-bottom:8px">📍 Orlando, Florida</p>
          <p>⏰ Replies within 1–2 days</p>
        </div>
      </div>
      <div class="win" style="margin:0">
        <div class="bar yellow"><span class="ttl">find-me.exe</span><span class="ctrls"><span>×</span></span></div>
        <div class="body">
          <div class="linkstack" style="gap:12px">
            <a href="#" class="btn blue">✦ Instagram</a>
            <a href="https://www.youtube.com/@bekindrewindproductions" class="btn red" target="_blank" rel="noopener">▶ YouTube</a>
          </div>
        </div>
      </div>
    </div>
  </div>


</div>
